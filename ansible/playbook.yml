---
- name: Configure web server and deploy static website
  hosts: webservers
  become: true
  vars_files:
    - vars.yml

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [packages]

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      tags: [packages]

    - name: Create dedicated user for the website
      ansible.builtin.user:
        name: "{{ web_user }}"
        shell: /bin/bash
        create_home: true
        state: present
      tags: [user]

    - name: Create website directory owned by that user
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        mode: "0755"
      tags: [website]

    - name: Deploy index.html from template
      ansible.builtin.template:
        src: index.html.j2
        dest: "{{ web_root }}/index.html"
        owner: "{{ web_user }}"
        group: "{{ web_user }}"
        mode: "0644"
      tags: [website]

    - name: Deploy Nginx server block
      ansible.builtin.template:
        src: nginx-site.conf.j2
        dest: /etc/nginx/sites-available/int333-site
        owner: root
        group: root
        mode: "0644"
      notify:
        - Test nginx configuration
        - Reload nginx
      tags: [nginx]

    - name: Enable our site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/int333-site
        dest: /etc/nginx/sites-enabled/int333-site
        state: link
      notify:
        - Test nginx configuration
        - Reload nginx
      tags: [nginx]

    - name: Disable the default Nginx welcome site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify:
        - Test nginx configuration
        - Reload nginx
      tags: [nginx]

    - name: Ensure Nginx is running and starts on boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [nginx]

    - name: Apply pending handlers now
      ansible.builtin.meta: flush_handlers

    - name: Verify the website responds correctly
      block:
        - name: Wait for port 80
          ansible.builtin.wait_for:
            port: 80
            timeout: 30

        - name: Request the home page
          ansible.builtin.uri:
            url: http://localhost/
            status_code: 200
            return_content: true
          register: site_check
          failed_when: "site_title not in site_check.content"
      rescue:
        - name: Collect Nginx diagnostics
          ansible.builtin.command: systemctl status nginx --no-pager
          register: nginx_status
          changed_when: false
          failed_when: false

        - name: Print diagnostics
          ansible.builtin.debug:
            var: nginx_status.stdout_lines

        - name: Fail clearly
          ansible.builtin.fail:
            msg: "Website verification FAILED - see diagnostics above."
      tags: [verify]

  handlers:
    - name: Test nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
